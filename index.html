<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#15100D" />
  <title>Adriano Lanches · Prensado na chapa</title>
  <meta name="description" content="Prensados e lanches na chapa em Umuarama. Monte, turbine e peça direto pelo cardápio." />
  <link rel="icon" href="https://imvzfueqnpkcrxumiqwz.supabase.co/storage/v1/object/public/produto-fotos/adriano-lanches/logo.webp" type="image/webp" />
  <link rel="apple-touch-icon" href="https://imvzfueqnpkcrxumiqwz.supabase.co/storage/v1/object/public/produto-fotos/adriano-lanches/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@400;500&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- BARRA -->
  <header class="bar" id="bar">
    <img class="bar-logo" src="https://imvzfueqnpkcrxumiqwz.supabase.co/storage/v1/object/public/produto-fotos/adriano-lanches/logo.webp" alt="Adriano Lanches" width="40" height="40" />
    <div class="bar-status" id="status"><i></i><span id="statusText">…</span></div>
    <button class="bar-cart" id="barCart" type="button" aria-label="Abrir comanda"><span>Comanda</span><b id="barCount">0</b></button>
  </header>

  <!-- HERO: anatomia do lanche, prensado conforme rola -->
  <section class="hero" id="hero">
    <div class="hero-stick">
      <div class="hero-copy">
        <p class="mono kicker">Adriano Lanches · Zona III · Umuarama</p>
        <h1 class="hero-q" id="heroQ">O que vai<br>dentro de um <em id="heroName">Big</em>?</h1>
        <h1 class="hero-a" id="heroA" aria-hidden="true">Prensado<br><em>na chapa.</em></h1>
      </div>
      <div class="hero-stage" id="heroStage">
        <div class="press" id="press"><span></span></div>
        <div class="steam" id="steam"><i></i><i></i><i></i><i></i></div>
        <div class="hero-stack" id="heroStack"></div>
        <div class="griddle"></div>
      </div>
      <div class="hero-foot" id="heroFoot">
        <div class="hero-price"><span class="mono" id="heroPriceLabel">um Big sai por</span><b id="heroPrice">R$ 47</b></div>
        <button class="btn hot" id="heroBtn" type="button">Quero esse</button>
      </div>
      <p class="mono hero-hint" id="heroHint">role pra prensar ↓</p>
    </div>
  </section>

  <!-- COMO FUNCIONA -->
  <section class="how">
    <div><b>01</b><span>Escolhe o lanche</span></div>
    <div><b>02</b><span>Tira o que não curte</span></div>
    <div><b>03</b><span>Turbina, se quiser</span></div>
  </section>

  <!-- PEDIDO AO VIVO / CLIENTE QUE VOLTA -->
  <button class="live" id="live" type="button" hidden></button>
  <section class="again" id="again" hidden></section>

  <!-- ABAS -->
  <nav class="tabs" id="tabs" aria-label="Categorias"></nav>

  <!-- CARDÁPIO -->
  <main class="menu" id="menu">
    <div class="loading mono">esquentando a chapa…</div>
  </main>

  <footer class="foot">
    <img src="https://imvzfueqnpkcrxumiqwz.supabase.co/storage/v1/object/public/produto-fotos/adriano-lanches/logo.webp" alt="" width="64" height="64" />
    <p id="footAddr"></p>
    <p class="mono" id="footHours"></p>
    <a class="gear" id="gear" href="#" aria-label="Painel do restaurante" title="Painel do restaurante" hidden>⚙</a>
  </footer>

  <!-- BARRA DA COMANDA -->
  <button class="tray" id="tray" type="button" aria-label="Abrir comanda">
    <span class="tray-stacks" id="trayStacks"></span>
    <span class="tray-txt"><b id="trayLabel">Ver comanda</b><small id="trayCount">0 itens</small></span>
    <span class="tray-total" id="trayTotal">R$ 0</span>
  </button>

  <!-- SHEET -->
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="stack.js"></script>
  <script src="pix.js"></script>
  <script src="app.js"></script>
</body>
</html>
