<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#120E0C" />
  <title>Adriano Lanches · Prensado na chapa</title>
  <meta name="description" content="Prensados e lanches na chapa em Umuarama. Monte do seu jeito e peça direto pelo cardápio." />
  <link rel="icon" href="https://imvzfueqnpkcrxumiqwz.supabase.co/storage/v1/object/public/produto-fotos/adriano-lanches/logo.webp" type="image/webp" />
  <link rel="apple-touch-icon" href="https://imvzfueqnpkcrxumiqwz.supabase.co/storage/v1/object/public/produto-fotos/adriano-lanches/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://imvzfueqnpkcrxumiqwz.supabase.co" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- BARRA -->
  <header class="bar" id="bar">
    <img class="bar-logo" src="https://imvzfueqnpkcrxumiqwz.supabase.co/storage/v1/object/public/produto-fotos/adriano-lanches/logo.webp" alt="Adriano Lanches" width="38" height="38" />
    <div class="bar-status" id="status"><i></i><span id="statusText">…</span></div>
    <button class="bar-cart" id="barCart" type="button" aria-label="Abrir comanda">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.5 11.5a2 2 0 0 1-2 1.5h-7a2 2 0 0 1-2-1.5L5 7Z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg>
      <span class="odo" id="barCount"><span>0</span></span>
    </button>
  </header>

  <!-- HERO: uma tela só -->
  <section class="hero" id="hero">
    <div class="hero-copy">
      <p class="eyebrow mono"><span id="heroWhere">Zona III · Umuarama</span></p>
      <h1 class="hero-title">
        <span class="ln"><span>Prensado</span></span>
        <span class="ln"><span>na <em>chapa.</em></span></span>
      </h1>
      <p class="hero-sub"><span>Monte do seu jeito, tire o que não curte e receba quentinho.</span></p>
    </div>

    <button class="hero-card" id="heroCard" type="button" aria-label="Ver o lanche em destaque">
      <span class="hero-media"><img id="heroImg" alt="" fetchpriority="high" /></span>
      <svg class="steam" viewBox="0 0 120 90" aria-hidden="true">
        <path d="M30 88c-10-14 10-22 0-38s8-24 0-40" /><path d="M60 88c-10-14 10-22 0-38s8-24 0-40" /><path d="M90 88c-10-14 10-22 0-38s8-24 0-40" />
      </svg>
      <span class="chip chip-hot" id="heroBadge">Mais pedido</span>
      <span class="hero-info">
        <span><b id="heroName">—</b><small id="heroIng"></small></span>
        <span class="hero-buy"><b id="heroPrice">—</b><i aria-hidden="true">+</i></span>
      </span>
    </button>

    <ul class="facts">
      <li><b id="factEntrega">—</b><span>entrega</span></li>
      <li><b id="factTaxa">—</b><span>taxa</span></li>
      <li><b id="factRetirada">—</b><span>retirada</span></li>
    </ul>
  </section>

  <!-- PEDIDO AO VIVO / CLIENTE QUE VOLTA -->
  <button class="live" id="live" type="button" hidden></button>
  <section class="again" id="again" hidden></section>

  <!-- ABAS -->
  <nav class="tabs" id="tabs" aria-label="Categorias"></nav>

  <!-- CARDÁPIO -->
  <main class="menu" id="menu">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </main>

  <footer class="foot">
    <img src="https://imvzfueqnpkcrxumiqwz.supabase.co/storage/v1/object/public/produto-fotos/adriano-lanches/logo.webp" alt="" width="56" height="56" loading="lazy" />
    <p id="footAddr"></p>
    <p class="mono" id="footHours"></p>
    <p class="foot-links" id="footLinks"></p>
    <a class="gear" id="gear" href="#" aria-label="Painel do restaurante" title="Painel do restaurante" hidden>⚙</a>
  </footer>

  <!-- BANDEJA -->
  <button class="tray" id="tray" type="button" aria-label="Abrir comanda">
    <span class="tray-thumbs" id="trayThumbs"></span>
    <span class="tray-txt"><b id="trayLabel">Ver comanda</b><small id="trayCount">0 itens</small></span>
    <span class="tray-total" id="trayTotal">R$ 0</span>
  </button>

  <!-- SHEET -->
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="stack.js"></script>
  <script src="pix.js"></script>
  <script src="entrega.js"></script>
  <script src="app.js"></script>
</body>
</html>
